<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillSwap Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f3ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 35px;
    width: 90%;
    max-width: 400px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #ddd6fe;
}

h1 {
    color: #6d28d9;
    text-align: center;
}

p {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    width: 100%;
    background: #7c3aed;
    color: white;
    padding: 13px;
    border: none;
    border-radius: 8px;
    margin-top: 25px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5b21b6;
}

a {
    color: #6d28d9;
}
</style>
</head>

<body>

<div class="container">

<h1>SkillSwap</h1>

<p>Welcome Back! Login to Continue</p>

<form id="loginForm">

<label>Email Address</label>
<input type="email"
       placeholder="Enter your email"
       required>

<label>Password</label>
<input type="password"
       placeholder="Enter password"
       required>

<button type="submit">Login</button>

</form>

<p>Don't have an account?
<a href="register.html">Register</a>
</p>

<p><a href="index.html">Back to Home</a></p>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Login page ready! Backend integration is pending.");
});
</script>

</body>
</html>
