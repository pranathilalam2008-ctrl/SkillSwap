<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA | Skills</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f3ff;
}

header {
    background: #6d28d9;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 14px;
    margin: 5px 0;
}

nav { margin-top: 15px; }

nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

h2 { color: #6d28d9; }

.section {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #ddd6fe;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    background: #7c3aed;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover { background: #5b21b6; }

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.skill-card {
    background: #f5f3ff;
    padding: 15px;
    margin-top: 15px;
    border-left: 5px solid #7c3aed;
    border-radius: 8px;
}

.skill-card h3 { color: #6d28d9; }

#skillList { margin-top: 20px; }

#message {
    margin-top: 12px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>NEXORA</h1>

    <p class="subtitle">
        A Collaborative Campus Learning Network
    </p>

    <nav>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./skills.html?v=21">Skills</a>
        <a href="./requests.html?v=20">Requests</a>
        <a href="./profile.html">My Profile</a>
        <a href="./index.html">Home</a>
    </nav>
</header>

<div class="container">

    <div class="section">
        <h2>Add Your Skill</h2>

        <form id="skillForm">

            <input
                type="text"
                id="skillName"
                placeholder="Skill Name (Example: Java)"
                maxlength="100"
                required
            >

            <select id="skillLevel" required>
                <option value="">Select Skill Level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <button type="submit" id="addButton">
                Add Skill
            </button>

            <p id="message" role="status"></p>
        </form>
    </div>

    <div class="section">
        <h2>Explore Skills</h2>

        <input
            type="text"
            id="searchSkill"
            placeholder="Search skills..."
        >

        <div id="skillList">Loading skills...</div>
    </div>

</div>

<script>

let skills = [];

const form = document.getElementById("skillForm");
const message = document.getElementById("message");
const addButton = document.getElementById("addButton");
const skillList = document.getElementById("skillList");

// Display skills
function displaySkills() {

    const search = document.getElementById("searchSkill")
        .value.trim().toLowerCase();

    skillList.innerHTML = "";

    const filtered = skills.filter(item =>
        item.skillName.toLowerCase().includes(search) ||
        item.studentName.toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        skillList.textContent = "No skills found.";
        return;
    }

    filtered.forEach(item => {

        const card = document.createElement("div");
        card.className = "skill-card";

        const title = document.createElement("h3");
        title.textContent = item.skillName;

        const student = document.createElement("p");
        student.textContent = "Student: " + item.studentName;

        const level = document.createElement("p");
        level.textContent = "Level: " + item.skillLevel;

        card.append(title, student, level);

        // Send Request button
        const requestButton = document.createElement("button");
        requestButton.textContent = "Send Request";
        requestButton.style.marginTop = "10px";

        requestButton.addEventListener("click", async function () {

            requestButton.disabled = true;
            requestButton.textContent = "Sending...";

            try {
                const response = await fetch(
                    "/api/requests/send/" + item.id,
                    {
                        method: "POST",
                        credentials: "same-origin"
                    }
                );

                if (response.status === 401) {
                    window.location.replace("login.html");
                    return;
                }

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to send request"
                    );
                }

                requestButton.textContent = "Request Sent";
                requestButton.disabled = true;

                alert("Learning request sent successfully!");

            } catch (error) {

                alert(error.message);

                requestButton.textContent = "Send Request";
                requestButton.disabled = false;
            }
        });

        card.appendChild(requestButton);
        skillList.appendChild(card);
    });
}

// Fetch real skills from MySQL through backend
async function loadSkills() {

    try {
        const response = await fetch("/api/skills", {
            credentials: "same-origin",
            cache: "no-store"
        });

        if (response.status === 401) {
            window.location.replace("login.html");
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to fetch skills");
        }

        skills = await response.json();

        displaySkills();

    } catch (error) {
        skillList.textContent =
            "Unable to load skills. Please try again.";
    }
}

// Add skill to MySQL
form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const skillData = {
        skillName: document.getElementById("skillName")
            .value.trim(),

        skillLevel: document.getElementById("skillLevel").value
    };

    message.textContent = "Saving skill...";
    message.style.color = "#6d28d9";
    addButton.disabled = true;

    try {
        const response = await fetch("/api/skills", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify(skillData)
        });

        if (response.status === 401) {
            window.location.replace("login.html");
            return;
        }

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Unable to add skill"
            );
        }

        message.textContent = "Skill added successfully!";
        message.style.color = "green";

        form.reset();

        await loadSkills();

    } catch (error) {

        message.textContent = error.message;
        message.style.color = "red";

    } finally {
        addButton.disabled = false;
    }
});

// Search
document.getElementById("searchSkill")
    .addEventListener("input", displaySkills);

// Load skills when page opens
loadSkills();

</script>

</body>
</html>
