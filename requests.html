<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillSwap - Requests</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f3ff;
}

header {
    background: #6d28d9;
    color: white;
    padding: 20px;
    text-align: center;
}

nav { margin-top: 15px; }

nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.section {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #ddd6fe;
}

h2 { color: #6d28d9; }

.request-card {
    background: #f5f3ff;
    padding: 18px;
    margin-top: 15px;
    border-left: 5px solid #7c3aed;
    border-radius: 8px;
}

button {
    background: #7c3aed;
    color: white;
    padding: 10px 18px;
    margin: 5px 8px 5px 0;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover { background: #5b21b6; }

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.reject { background: #dc2626; }

.reject:hover { background: #b91c1c; }

.status { font-weight: bold; }

</style>
</head>

<body>

<header>
    <h1>SkillSwap</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="skills.html">Skills</a>
        <a href="requests.html">Requests</a>
        <a href="profile.html">My Profile</a>
        <a href="index.html">Home</a>
    </nav>
</header>

<div class="container">

    <div class="section">
        <h2>Received Requests</h2>
        <div id="receivedList">Loading...</div>
    </div>

    <div class="section">
        <h2>Sent Requests</h2>
        <div id="sentList">Loading...</div>
    </div>

</div>

<script>

// Common function for API calls
async function getRequests(type) {

    const response = await fetch(
        "/api/requests/" + type,
        {
            credentials: "same-origin",
            cache: "no-store"
        }
    );

    if (response.status === 401) {
        window.location.replace("login.html");
        return null;
    }

    if (!response.ok) {
        throw new Error("Unable to load requests");
    }

    return await response.json();
}

// Update received request status
async function updateStatus(requestId, status, button) {

    button.disabled = true;

    try {
        const response = await fetch(
            "/api/requests/" + requestId + "/status",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({ status: status })
            }
        );

        if (response.status === 401) {
            window.location.replace("login.html");
            return;
        }

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Unable to update request"
            );
        }

        await loadRequests();

    } catch (error) {
        alert(error.message);
        button.disabled = false;
    }
}

// Create request card safely
function createCard(item, type) {

    const card = document.createElement("div");
    card.className = "request-card";

    const name = document.createElement("h3");

    name.textContent = type === "received"
        ? "From: " + item.senderName
        : "To: " + item.receiverName;

    const skill = document.createElement("p");
    skill.textContent = "Skill: " + item.skillName;

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Status: " + item.status;

    card.append(name, skill, status);

    if (type === "received" && item.status === "PENDING") {

        const acceptButton = document.createElement("button");
        acceptButton.textContent = "Accept";

        acceptButton.addEventListener("click", function() {
            updateStatus(item.id, "ACCEPTED", acceptButton);
        });

        const rejectButton = document.createElement("button");
        rejectButton.className = "reject";
        rejectButton.textContent = "Reject";

        rejectButton.addEventListener("click", function() {
            updateStatus(item.id, "REJECTED", rejectButton);
        });

        card.append(acceptButton, rejectButton);
    }

    return card;
}

// Display requests
async function loadRequests() {

    const receivedList =
        document.getElementById("receivedList");

    const sentList =
        document.getElementById("sentList");

    try {
        const received = await getRequests("received");
        const sent = await getRequests("sent");

        if (received === null || sent === null) return;

        receivedList.replaceChildren();
        sentList.replaceChildren();

        if (received.length === 0) {
            receivedList.textContent = "No received requests yet.";
        } else {
            received.forEach(item => {
                receivedList.appendChild(
                    createCard(item, "received")
                );
            });
        }

        if (sent.length === 0) {
            sentList.textContent = "No sent requests yet.";
        } else {
            sent.forEach(item => {
                sentList.appendChild(
                    createCard(item, "sent")
                );
            });
        }

    } catch (error) {
        receivedList.textContent = "Unable to load requests.";
        sentList.textContent = "Unable to load requests.";
    }
}

loadRequests();

</script>

</body>
</html>
